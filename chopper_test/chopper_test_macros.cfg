# Crydteam chopper_test - UI macros for Mainsail/Fluidd
# Include from printer.cfg:   [include chopper_test_macros.cfg]
#
# Every parameter is optional. Empty fields are NOT passed on, so the
# plugin defaults (and your [chopper_test] config) stay in charge.

[gcode_macro CT_TUNE]
description: Tune the TMC chopper registers by torque + temperature (no ADXL)
gcode:
  {% set cmd = 'CHOPPER_TUNE' %}
  {% if params.AXIS is defined %}{% set cmd = cmd ~ ' AXIS=' ~ params.AXIS %}{% endif %}
  {% if params.VELOCITY is defined %}{% set cmd = cmd ~ ' VELOCITY=' ~ params.VELOCITY %}{% endif %}
  {% if params.ACCEL is defined %}{% set cmd = cmd ~ ' ACCEL=' ~ params.ACCEL %}{% endif %}
  {% if params.REPEAT is defined %}{% set cmd = cmd ~ ' REPEAT=' ~ params.REPEAT %}{% endif %}
  {% if params.TPFD is defined %}{% set cmd = cmd ~ ' TPFD=' ~ params.TPFD %}{% endif %}
  {% if params.THERMAL is defined %}{% set cmd = cmd ~ ' THERMAL=' ~ params.THERMAL %}{% endif %}
  {% if params.THERMAL_SECONDS is defined %}{% set cmd = cmd ~ ' THERMAL_SECONDS=' ~ params.THERMAL_SECONDS %}{% endif %}
  {cmd}

[gcode_macro CT_STATUS]
description: Show the chopper registers of an axis and whether it can be tuned
gcode:
  {% set cmd = 'CHOPPER_TEST_STATUS' %}
  {% if params.AXIS is defined %}{% set cmd = cmd ~ ' AXIS=' ~ params.AXIS %}{% endif %}
  {cmd}
