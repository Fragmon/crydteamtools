# ─────────────────────────────────────────────────────────────────────
#  Crydteam Chopper Test — plugin configuration
#  by Steven (Fragmon) — Crydteam · youtube.com/@crydteamprinting
#
#  Tunes the TMC chopper registers (TOFF, TBL, HSTRT, HEND, TPFD) by
#  MEASURING the result — torque via lost steps, and motor temperature —
#  instead of vibration. No accelerometer needed.
#
#  HOW TO ENABLE:
#    1. Remove the leading '#' from the [chopper_test] line below.
#    2. Run FIRMWARE_RESTART.
#
#  REQUIREMENTS: the axis must run in SpreadCycle (no
#  stealthchop_threshold) — the chopper registers have no effect in
#  StealthChop, and the plugin refuses to run there.
#
#  This file was copied (not linked) by the installer, so your edits
#  survive plugin updates.
# ─────────────────────────────────────────────────────────────────────

#[chopper_test]

## Machine kinematics: cartesian or corexy. On CoreXY both motors drive
## every X/Y move, so both are watched for lost steps and re-homed.
#structure: cartesian

## Axis used when CHOPPER_TUNE is called without AXIS=...
#default_axis: X

## Safety distance (mm) kept from both axis ends during test moves.
#margin: 20.0

## Z height (mm) the toolhead is lifted to before testing.
#z_pos: 20.0

## Tolerated deviation in full steps when comparing stepper MCU
## positions after re-homing. Above this, the move counts as
## "steps lost" — the score this plugin ranks settings by.
#max_missed: 1.5

## Speed (mm/s) for positioning moves between measurements.
#travel_speed: 100

## Optional: a Klipper temperature sensor mounted on the motor, used
## for the thermal comparison at the end of a run. Give the full
## section name. Without it the plugin falls back to the driver's own
## sensor (TMC2240 only) and otherwise skips the thermal stage.
#motor_sensor: temperature_sensor motor_x

## Seconds of continuous motion per thermal measurement. The stage runs
## twice (original settings vs. tuned), plus a 60 s cool-down between.
#thermal_seconds: 90

## Where CSV reports are written.
#output_dir: ~/printer_data/config/Choppertest
