# Crydteam pa_test - UI macros for Mainsail/Fluidd
# Include from printer.cfg:   [include pa_test_macros.cfg]
#
# Every parameter is optional. Empty fields are NOT passed on, so the
# plugin defaults stay in charge.

[gcode_macro PT_PROBE]
description: Record the extruder SG step response to flow jumps (PA feasibility probe)
gcode:
  {% set cmd = 'PA_TEST_PROBE' %}
  {% if params.FLOW_LOW is defined %}{% set cmd = cmd ~ ' FLOW_LOW=' ~ params.FLOW_LOW %}{% endif %}
  {% if params.FLOW_HIGH is defined %}{% set cmd = cmd ~ ' FLOW_HIGH=' ~ params.FLOW_HIGH %}{% endif %}
  {% if params.DWELL is defined %}{% set cmd = cmd ~ ' DWELL=' ~ params.DWELL %}{% endif %}
  {% if params.CYCLES is defined %}{% set cmd = cmd ~ ' CYCLES=' ~ params.CYCLES %}{% endif %}
  {cmd}
