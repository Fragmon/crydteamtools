# ─────────────────────────────────────────────────────────────────────
#  Crydteam PA Test — plugin configuration (PROTOTYPE)
#  by Steven (Fragmon) — Crydteam · youtube.com/@crydteamprinting
#
#  Pressure-advance calibration via the extruder TMC driver's
#  StallGuard signal. This prototype ships the feasibility probe
#  (PA_TEST_PROBE) that records the melt-pressure step response —
#  the full PA search builds on its results.
#
#  HOW TO ENABLE:
#    1. Remove the leading '#' from the [pa_test] line below.
#    2. Run FIRMWARE_RESTART.
#  Everything else is OPTIONAL — every option is listed with its
#  default value.
#
#  REQUIREMENTS: same as the TMC Flow Test — the extruder driver
#  needs working StallGuard readback (see max_flow_test docs).
#
#  This file was copied (not linked) by the installer, so your edits
#  survive plugin updates.
# ─────────────────────────────────────────────────────────────────────

#[pa_test]

## Name of the extruder stepper whose TMC driver is monitored.
#extruder_stepper: extruder

## Filament diameter (mm) — converts flow (mm³/s) to feed rate.
#filament_diameter: 1.75

## Minimum hotend temperature (°C) required before the probe runs.
#min_hotend_temp: 180

## Where probe CSVs are written.
#output_dir: ~/printer_data/config/PAtest
