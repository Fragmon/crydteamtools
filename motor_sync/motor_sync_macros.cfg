# Crydteam motor_sync - UI macros for Mainsail/Fluidd
# Include from printer.cfg:   [include motor_sync_macros.cfg]
#
# Every parameter is optional. Empty fields are NOT passed on, so the
# plugin defaults (and your [motor_sync] config) stay in charge.

[gcode_macro MS_SYNC]
description: Sync the two motors of a dual-motor axis via TMC StallGuard (no ADXL needed)
gcode:
  {% set cmd = 'MOTOR_SYNC' %}
  {% if params.AXIS is defined %}{% set cmd = cmd ~ ' AXIS=' ~ params.AXIS %}{% endif %}
  {% if params.BUZZ_SPEED is defined %}{% set cmd = cmd ~ ' BUZZ_SPEED=' ~ params.BUZZ_SPEED %}{% endif %}
  {% if params.BUZZ_DIST is defined %}{% set cmd = cmd ~ ' BUZZ_DIST=' ~ params.BUZZ_DIST %}{% endif %}
  {% if params.REPEATS is defined %}{% set cmd = cmd ~ ' REPEATS=' ~ params.REPEATS %}{% endif %}
  {% if params.COARSE is defined %}{% set cmd = cmd ~ ' COARSE=' ~ params.COARSE %}{% endif %}
  {% if params.MAX_OFFSET is defined %}{% set cmd = cmd ~ ' MAX_OFFSET=' ~ params.MAX_OFFSET %}{% endif %}
  {% if params.MIN_GAIN is defined %}{% set cmd = cmd ~ ' MIN_GAIN=' ~ params.MIN_GAIN %}{% endif %}
  {cmd}

[gcode_macro MS_STATUS]
description: Show dual-motor axes, TMC drivers and motor_sync config
gcode:
  MOTOR_SYNC_STATUS
