# ─────────────────────────────────────────────────────────────────────
#  Crydteam Motor Sync — plugin configuration
#  by Steven (Fragmon) — Crydteam · youtube.com/@crydteamprinting
#
#  Synchronizes the two motors of a dual-motor axis (e.g. [stepper_x]
#  + [stepper_x1]) using the TMC drivers' StallGuard load signal —
#  no accelerometer needed.
#
#  HOW TO ENABLE:
#    1. Remove the leading '#' from the [motor_sync] line below.
#    2. Run FIRMWARE_RESTART.
#  Everything else is OPTIONAL — every option is listed with its
#  default value. Uncomment and change only what you need.
#
#  REQUIREMENTS: both motors need their own TMC driver section with
#  StallGuard readback (TMC2130/2209/2240/5160/2660 — NOT 2208/2225)
#  and 'coolstep_threshold' set below buzz_speed. SG2 drivers
#  (2130/2240/5160/2660) additionally need SpreadCycle (no
#  stealthchop_threshold); the TMC2209 needs StealthChop.
#
#  This file was copied (not linked) by the installer, so your edits
#  survive plugin updates.
# ─────────────────────────────────────────────────────────────────────

#[motor_sync]

## Axis used when MOTOR_SYNC is called without AXIS=...
#default_axis: X

## Speed (mm/s) of the constant measurement move. StallGuard needs
## roughly >= 1.5 motor revolutions/s for valid readings — with a
## typical rotation_distance of 40 mm that means >= ~60 mm/s.
#buzz_speed: 100

## Length (mm) of the measurement move, centred in the axis range.
#buzz_distance: 40

## Measurement passes per data point (direction alternates so belt /
## friction asymmetry averages out).
#repeats: 2

## Speed (mm/s) for positioning moves between measurements.
#travel_speed: 100

## Initial correction step size in microsteps (halved down to 1
## during refinement).
#coarse_msteps: 4

## Safety cap for the total single-motor correction, in full steps.
## 2.0 = half an electrical period — desync after power-on can never
## legitimately exceed this.
#max_offset_fullsteps: 2.0

## Minimum StallGuard score improvement (raw SG units, both drivers
## summed) required to accept a correction step. Raise this if the
## sync "wanders" on a noisy setup.
#min_gain: 4
