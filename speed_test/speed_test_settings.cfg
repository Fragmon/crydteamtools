# ─────────────────────────────────────────────────────────────────────
#  Crydteam Speed Test — plugin configuration
#  by Steven (Fragmon) — Crydteam · youtube.com/@crydteamprinting
#
#  HOW TO ENABLE:
#    1. Remove the leading '#' from the [speed_test] line below.
#    2. Run FIRMWARE_RESTART.
#  Everything else is OPTIONAL — every option is listed with its
#  default value. Uncomment and change only what you need.
#
#  This file was copied (not linked) by the installer, so your edits
#  survive plugin updates.
# ─────────────────────────────────────────────────────────────────────

#[speed_test]

## Machine kinematics: cartesian, corexy or corexz. Determines which
## steppers move for a given axis test.
#structure: cartesian

## Axis used when a test command is called without AXIS=...
#default_axis: X

## Safety distance (mm) kept from both axis ends during test moves.
#margin: 20.0

## Z height (mm) the toolhead is lifted to before testing, so the
## nozzle clears clips, glue sticks and print remains.
#z_pos: 20.0

## Log TMC driver values (run_current, driver registers) into the
## CSV/HTML reports.
#monitor_tmc: True

## Distance (mm) from the endstop where test moves start.
## 0 = automatic (20 % of the axis travel).
#start_offset: 0

## Speed (mm/s) and acceleration (mm/s²) used for positioning moves
## between measurements (NOT for the measurements themselves).
#travel_speed: 100
#travel_accel: 3000

## Tolerated deviation in full steps when comparing stepper MCU
## positions after re-homing. Above this, the move counts as
## "steps lost".
#max_missed: 1.5

## Testbench mode: a single stepper on a bench (only one axis wired,
## no full printer). Skips homing/kinematics checks.
#testbench: False

## Hardware current ceiling (A) for the current search and benchmark
## stages of SPEED_TEST_FIND_LIMITS. 0 = use the configured
## run_current as ceiling.
#max_current: 0

## Where CSV and HTML reports are written.
#output_dir: ~/printer_data/config/Speedtest
