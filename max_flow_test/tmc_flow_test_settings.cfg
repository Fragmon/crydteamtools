# ─────────────────────────────────────────────────────────────────────
#  Crydteam TMC Flow Test — plugin configuration
#  by Steven (Fragmon) — Crydteam · youtube.com/@crydteamprinting
#
#  HOW TO ENABLE:
#    1. Remove the leading '#' from the [tmc_flow_test] line below.
#    2. Run FIRMWARE_RESTART.
#  Everything else is OPTIONAL — every option is listed with its
#  default value. Uncomment and change only what you need.
#
#  This file was copied (not linked) by the installer, so your edits
#  survive plugin updates.
# ─────────────────────────────────────────────────────────────────────

#[tmc_flow_test]

## Name of the extruder stepper whose TMC driver is monitored.
#extruder_stepper: extruder

## Filament diameter (mm) — used to convert flow (mm³/s) to feed rate.
#filament_diameter: 1.75

## Length (mm) of the hotend melt zone. Only used for reporting.
#melt_zone_length: 42.0

## Minimum hotend temperature (°C) required before the test starts.
#min_hotend_temp: 180

## Part-cooling fan speed during the test (0-100 %). Fans have a real
## impact on max flow (the heater works 10-20 % harder at 100 %), so
## the value is locked once the test starts. Override per run with
## FAN_SPEED= on TMC_FLOW_FIND_MAX.
#test_fan_speed: 0

## Explicit fan object to control instead of the primary part-cooling
## fan (M106), e.g. "fan_generic aux_fan".
#fan_object_name:

## Additional thermistors to log alongside the extruder, as a comma-
## separated list of printer-config section names, e.g.:
##   extra_thermistors: chamber, heater_generic heatbreak
## Names that don't resolve are silently skipped at test start.
#extra_thermistors:

## Where CSV and HTML reports are written.
#output_dir: ~/printer_data/config/Flowtest
